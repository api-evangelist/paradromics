aid: paradromics
name: Paradromics
description: 'Paradromics is a clinical-stage neurotechnology company headquartered
  in Austin, Texas, with a machine-learning and data-science office in Oakland, California,
  developing high-data-rate implantable brain-computer interfaces (BCI). Founded in
  2019 by Matt Angle, the company builds the Connexus BCI, an investigational fully
  implantable system that records high-resolution intracortical neural activity and
  transmits it through the skin to an external system that decodes intended speech,
  text and digital device control for people with severe motor impairment. Connexus
  holds FDA Breakthrough Device Designations for speech decoding (2023) and digital
  device control (2024), was accepted into the FDA Total Product Life Cycle Advisory
  Program, and received an Investigational Device Exemption in November 2025 for the
  Connect-One Early Feasibility Study (ClinicalTrials.gov NCT07357428). Tempo BCI is
  a pre-clinical-trial pipeline product. Paradromics publishes no public developer
  API, SDK or machine-readable API contract; its only machine-readable public surface
  is an llms.txt AI-context file at paradromics.com/llms.txt.'
